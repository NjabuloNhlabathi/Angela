<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yay! I Can't Wait! 💖</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="yes-body">

  <!-- Background Audio: Plays automatically on page load -->
  <audio id="bgMusic" autoplay loop preload="auto">
    <source src="SOFT.mp3" type="audio/mpeg">
    <source src="SOFT.Mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>

  <!-- Animated Glowing Page Border Wrapping Entire Page -->
  <div class="romantic-page-frame">

    <!-- Ambient Falling CSS Hearts -->
    <div class="falling-hearts-container" aria-hidden="true">
      <div class="falling-heart css-heart"></div>
      <div class="falling-heart css-heart"></div>
      <div class="falling-heart css-heart"></div>
      <div class="falling-heart css-heart"></div>
      <div class="falling-heart css-heart"></div>
      <div class="falling-heart css-heart"></div>
    </div>

    <!-- Main Container Inside the Animated Border -->
    <main class="success-container">

      <!-- Celebration Header -->
      <header class="celebration-header">
        <h1 class="celebration-title">Yay! I Can't Wait! 🥰</h1>
        <p class="celebration-subtitle">You just made my whole world brighter! 🌹✨</p>
      </header>

      <!-- 4 Media Cards (Video & Photos from angy folder) -->
      <section class="videos-grid">
        
        <!-- Media 1: Video -->
        <article class="video-card">
          <div class="heart-badge css-heart"></div>
          <div class="video-wrapper">
            <video class="placeholder-video" controls autoplay muted loop playsinline preload="auto">
              <source src="angy/ANGY.mp4" type="video/mp4">
              Your browser does not support the video tag.
            </video>
          </div>
          <p class="video-caption">
            <span class="css-heart"></span>
            <span>Your Radiant Smile 🥰</span>
          </p>
        </article>

        <!-- Media 2: Image (ang aura) -->
        <article class="video-card">
          <div class="heart-badge css-heart"></div>
          <div class="video-wrapper">
            <img src="angy/ang aura.jpeg" alt="Ang Aura" loading="lazy">
          </div>
          <p class="video-caption">
            <span class="css-heart"></span>
            <span>Pure Aura ✨</span>
          </p>
        </article>

        <!-- Media 3: Image (Lap Andy) -->
        <article class="video-card">
          <div class="heart-badge css-heart"></div>
          <div class="video-wrapper">
            <img src="angy/Lap Andy.jpeg" alt="Lap Andy" loading="lazy">
          </div>
          <p class="video-caption">
            <span class="css-heart"></span>
            <span>Favorite Moment 💖</span>
          </p>
        </article>

        <!-- Media 4: Image (whiteAngy) -->
        <article class="video-card">
          <div class="heart-badge css-heart"></div>
          <div class="video-wrapper">
            <img src="angy/whiteAngy.jpeg" alt="White Angy" loading="lazy">
          </div>
          <p class="video-caption">
            <span class="css-heart"></span>
            <span>Stunning Always 🌹</span>
          </p>
        </article>

      </section>

      <!-- Back Link -->
      <footer>
        <a href="index.html" class="return-home">
          <span>Ask me again? 😉</span>
        </a>
      </footer>

    </main>
  </div>

  <!-- Audio Autoplay Support Script -->
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const audio = document.getElementById('bgMusic');
      if (!audio) return;

      const playPromise = audio.play();
      if (playPromise !== undefined) {
        playPromise.catch(() => {
          // If browser policy requires gesture, start on first click or touch
          const startAudio = () => {
            audio.play();
            document.removeEventListener('click', startAudio);
            document.removeEventListener('touchstart', startAudio);
          };
          document.addEventListener('click', startAudio);
          document.addEventListener('touchstart', startAudio);
        });
      }
    });
  </script>
</body>
</html>
