<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yay! I Can't Wait! 💖</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="yes-body">

  <!-- Background Audio: Plays automatically starting at 1:10 (70s) -->
  <audio id="bgMusic" loop preload="auto">
    <source src="SOFT.mp3#t=70" type="audio/mpeg">
    <source src="SOFT.Mp3#t=70" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>

  <!-- Animated Glowing Page Border Wrapping Entire Page -->
  <div class="romantic-page-frame">

    <!-- Ambient Falling CSS Hearts -->
    <div class="falling-hearts-container" aria-hidden="true">
      <div class="falling-heart css-heart"></div>
      <div class="falling-heart css-heart"></div>
      <div class="falling-heart css-heart"></div>
      <div class="falling-heart css-heart"></div>
      <div class="falling-heart css-heart"></div>
      <div class="falling-heart css-heart"></div>
    </div>

    <!-- Main Container Inside the Animated Border -->
    <main class="success-container">

      <!-- Celebration Header -->
      <header class="celebration-header">
        <h1 class="celebration-title">Yay! I Can't Wait! 🥰</h1>
        <p class="celebration-subtitle">You just made my whole world brighter! 🌹✨</p>
      </header>

      <!-- 4 Media Cards (Video & Photos from angy folder) -->
      <section class="videos-grid">
        
        <!-- Media 1: Video -->
        <article class="video-card">
          <div class="heart-badge css-heart"></div>
          <div class="video-wrapper">
            <video class="placeholder-video" controls autoplay muted loop playsinline preload="auto">
              <source src="angy/ANGY.mp4" type="video/mp4">
              Your browser does not support the video tag.
            </video>
          </div>
          <p class="video-caption">
            <span class="css-heart"></span>
            <span>Your Radiant Smile 🥰</span>
          </p>
        </article>

        <!-- Media 2: Image (ang aura) -->
        <article class="video-card">
          <div class="heart-badge css-heart"></div>
          <div class="video-wrapper">
            <img src="angy/ang aura.jpeg" alt="Ang Aura" loading="lazy">
          </div>
          <p class="video-caption">
            <span class="css-heart"></span>
            <span>Pure Aura ✨</span>
          </p>
        </article>

        <!-- Media 3: Image (Lap Andy) -->
        <article class="video-card">
          <div class="heart-badge css-heart"></div>
          <div class="video-wrapper">
            <img src="angy/Lap Andy.jpeg" alt="Lap Andy" loading="lazy">
          </div>
          <p class="video-caption">
            <span class="css-heart"></span>
            <span>Favorite Moment 💖</span>
          </p>
        </article>

        <!-- Media 4: Image (whiteAngy) -->
        <article class="video-card">
          <div class="heart-badge css-heart"></div>
          <div class="video-wrapper">
            <img src="angy/whiteAngy.jpeg" alt="White Angy" loading="lazy">
          </div>
          <p class="video-caption">
            <span class="css-heart"></span>
            <span>Stunning Always 🌹</span>
          </p>
        </article>

      </section>

      <!-- Back Link -->
      <footer>
        <a href="index.html" class="return-home">
          <span>Ask me again? 😉</span>
        </a>
      </footer>

    </main>
  </div>

  <!-- Audio Autoplay Support Script (Starts at 1:10 = 70s) -->
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const audio = document.getElementById('bgMusic');
      if (!audio) return;

      const START_TIME = 70; // 1:10 in seconds

      const setAndPlay = () => {
        try {
          audio.currentTime = START_TIME;
        } catch (e) {}

        const playPromise = audio.play();
        if (playPromise !== undefined) {
          playPromise.catch(() => {
            // If browser policy requires user gesture, start at 1:10 on first click or touch
            const enableAudio = () => {
              try {
                audio.currentTime = START_TIME;
              } catch (e) {}
              audio.play();
              document.removeEventListener('click', enableAudio);
              document.removeEventListener('touchstart', enableAudio);
            };
            document.addEventListener('click', enableAudio);
            document.addEventListener('touchstart', enableAudio);
          });
        }
      };

      if (audio.readyState >= 1) {
        setAndPlay();
      } else {
        audio.addEventListener('loadedmetadata', setAndPlay, { once: true });
        // Fallback attempt in case event already passed
        setTimeout(setAndPlay, 60);
      }
    });
  </script>
</body>
</html>
