<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Will You Go Out With Me? 💖</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="index-body">

  <!-- Side Videos: eh.mp4 on left, eh2.mp4 on right -->
  <div class="side-video side-left" aria-hidden="true">
    <video class="border-video" autoplay muted loop playsinline preload="auto">
      <source src="Eh.mp4" type="video/mp4">
    
    </video>
  </div>
  <div class="side-video side-right" aria-hidden="true">
    <video class="border-video" autoplay muted loop playsinline preload="auto">
      <source src="eh2.mp4" type="video/mp4">
    </video>
  </div>

  <!-- Centered Main Asking Area -->
  <main class="proposal-card">
    <div class="sparkle-heart">💖</div>
    <h1 class="question-text">Will you go out with me?</h1>
    <p class="subtitle-text">oh no u realized im corny eish eish</p>

    <div class="buttons-container">
      <a href="yes.html" class="btn btn-yes" id="yesBtn">
        <span>Yes! 🥰</span>
      </a>
      <button type="button" class="btn btn-no" id="noBtn">
        <span>No 😢</span>
      </button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
